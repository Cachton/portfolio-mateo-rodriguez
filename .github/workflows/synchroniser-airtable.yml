name: Synchroniser Airtable

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  synchroniser:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier les secrets
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        run: |
          test -n "$AIRTABLE_TOKEN" || (echo "Le secret AIRTABLE_TOKEN est absent." && exit 1)
          test -n "$AIRTABLE_BASE_ID" || (echo "Le secret AIRTABLE_BASE_ID est absent." && exit 1)
          test -n "$AIRTABLE_TABLE_NAME" || (echo "Le secret AIRTABLE_TABLE_NAME est absent." && exit 1)

      - name: Synchroniser les projets
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        run: node js/data.js

      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projets.json
          git diff --cached --quiet || git commit -m "Synchroniser les projets Airtable"
          git push
